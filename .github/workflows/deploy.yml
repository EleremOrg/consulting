name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Cancel any in-flight deploy when a new commit lands on main.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build & deploy (Cloudflare Workers)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://elerem.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build dev shell
        run: nix develop --command true

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(nix develop --command pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Build site
        run: nix develop --command pnpm build

      # wrangler-action's own setup expects to install Node/pnpm/wrangler.
      # We already have wrangler from the Nix shell, so we run it directly
      # instead of using cloudflare/wrangler-action — fewer moving parts.
      - name: Deploy with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: nix develop --command wrangler deploy
